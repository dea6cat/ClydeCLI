[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clyde-cli"
version = "0.8.0"
description = "A coding-agent harness for your terminal: bring any LLM, cloud or local, and Clyde turns it into an agent"
readme = "README.md"
# SPDX (PEP 639): the "(portions MIT)" detail lives in LICENSE. setuptools >=77 accepts the expression form; the old table form is deprecated.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
# 3.12 is SkillSpector's floor and 3.14 its ceiling (v2.12.0 declares >=3.12,<3.15); raise the ceiling when it does.
requires-python = ">=3.12,<3.15"
authors = [
    {name = "dea6cat", email = "notalexander24@gmail.com"}
]
keywords = ["cli", "ai", "llm", "agent", "anthropic", "openai", "gemini", "ollama", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
    # httpx trusts certifi's roots; 2026.10.19 drops emSign ECC Root CA - G3 (the eMudhra weak-key incident).
    "certifi>=2026.10.19",
    # The Data tool's engine: profile and query CSV, Parquet and JSON files with read-only SQL.
    "duckdb>=1.5,<2",
    # Ranks local models by real benchmarks and how they fit the machine: our fork of github.com/Andyyyy64/whichllm (MIT)
    # with a library entry point, vendored at src/vendor/whichllm (license there) so a git pin can't break installs again.
    "psutil>=5.9",
    # whichllm's own imports (its api and model cache); they used to arrive only as SkillSpector's dependencies.
    "click>=8",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Laya, the local decision model that spots a stuck model (github.com/NandhaKishorM/laya); pinned, it pins its own weights.
# Optional because it pulls in torch and transformers (about 800 MB of packages before the model download).
laya = ["laya==0.3.23"]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
clyde = "src.cli:main"
bonnie = "src.cli:bonnie_main"

[project.urls]
Homepage = "https://github.com/dea6cat/ClydeCLI"
Repository = "https://github.com/dea6cat/ClydeCLI"
Documentation = "https://github.com/dea6cat/ClydeCLI#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Ship the vendored code's MIT license text with it (attribution travels with the code).
[tool.setuptools.package-data]
"src.vendor.whichllm" = ["LICENSE"]
# The station's pictures (generated for this project: see THIRD_PARTY.md).
"src.agent" = ["station_art/*.png"]
