[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clyde-cli"
version = "0.2.3"
description = "A coding-agent harness for your terminal: bring any LLM, cloud or local, and Clyde turns it into an agent"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0 (portions MIT); see LICENSE"}
requires-python = ">=3.14"
authors = [
    {name = "dea6cat", email = "notalexander24@gmail.com"}
]
keywords = ["cli", "ai", "llm", "agent", "anthropic", "openai", "gemini", "ollama", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
    # Bundled local decision model (github.com/NandhaKishorM/laya); pinned, it pins its own weights.
    "laya==0.3.23",
    # Bundled security scanner for skills, plugins and MCP servers from other agents (not on PyPI).
    "skillspector @ git+https://github.com/NVIDIA/SkillSpector@v2.12.0",
    # The Data tool's engine: profile and query CSV, Parquet and JSON files with read-only SQL.
    "duckdb>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
clyde = "src.cli:main"
bonnie = "src.cli:bonnie_main"

[project.urls]
Homepage = "https://github.com/dea6cat/ClydeCLI"
Repository = "https://github.com/dea6cat/ClydeCLI"
Documentation = "https://github.com/dea6cat/ClydeCLI#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
