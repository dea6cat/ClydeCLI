[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clyde-cli"
version = "0.1.0"
description = "A complete Python reimplementation of Claude Code CLI - Drop-in replacement experience"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [
    {name = "dea6cat", email = "notalexander24@gmail.com"}
]
keywords = ["cli", "ai", "llm", "agent", "anthropic", "openai", "gemini", "ollama", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "python-dotenv",
    "rich",
    "prompt-toolkit",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
clyde = "src.cli:main"

[project.urls]
Homepage = "https://github.com/dea6cat/ClydeCLI"
Repository = "https://github.com/dea6cat/ClydeCLI"
Documentation = "https://github.com/dea6cat/ClydeCLI#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
