name: GitHub stats

# Keeps GitHub's 14-day traffic numbers, and who starred, forked or watches, in the private repo dea6cat/clydecli-stats.
# Needs the secret STATS_TOKEN: a fine-grained token for this repo and dea6cat/clydecli-stats with Administration (read)
# and Contents (read and write). This log is public, so the script's output (which names stargazers) is discarded.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dea6cat/clydecli-stats
          token: ${{ secrets.STATS_TOKEN }}
          path: stats
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 tools/github_stats.py dea6cat/ClydeCLI --out stats/dea6cat-ClydeCLI.json > /dev/null
      - name: Save
        working-directory: stats
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name=Alexander -c user.email=notalexander24@gmail.com commit -q -m "Stats $(date -u +%F)"
          git push -q
