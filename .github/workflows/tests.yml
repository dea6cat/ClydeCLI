name: Tests

# The suite on every Python the package supports (SkillSpector needs 3.12 and does not support 3.15 yet), without the optional
# Laya extra, which is what a plain install gets; Laya's code paths are tested with it absent.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -q
